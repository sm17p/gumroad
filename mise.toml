# # mise config files are hierarchical. mise will find all of the config files
# # in all parent directories and merge them together.
# # You might have a structure like:
#
# * ~/work/project/mise.toml   # a config file for a specific work project
# * ~/work/mise.toml           # a config file for projects related to work
# * ~/.config/mise/config.toml # the global config file
# * /etc/mise/config.toml      # the system config file
#
# # This setup allows you to define default versions and configuration across
# # all projects but override them for specific projects.
#
# # set arbitrary env vars to be used whenever in this project or subprojects
[env]
DISABLE_SPRING="1"
SSL_CERT_FILE="/Users/yoda/github/antiwork/gumroad/tmp/combined_ca_certs.pem"
NODE_EXTRA_CA_CERTS="/Users/yoda/Library/Application Support/mkcert/rootCA.pem"
LOCAL_PROXY_DOMAIN="better-sturgeon-evidently.ngrok-free.app"
# VCR_DEBUG=1
# NODE_ENV = "development"
# NPM_CONFIG_PREFIX = "~/.npm-global"
# EDITOR = "code --wait"
#
mise.file = ".env"                # load vars from a dotenv file
# mise.path = "./node_modules/.bin" # add a directory to PATH
#
# [plugins]
# # specify a custom repo url so you can install with `mise plugin add <name>`
# # note this will only be used if the plugin is not already installed
# python = 'https://github.com/asdf-community/asdf-python'
#

# 🔧 Port Management & Cleanup
[tasks.kill-port]
description = "Kill process on specific port"
run = '''
#!/usr/bin/env bash
if [ $# -eq 0 ]; then
    echo "Usage: mise run kill-port <port>"
    exit 1
fi

port=$1

# Validate port number
if ! [[ "$port" =~ ^[0-9]+$ ]] || [ "$port" -lt 1024 ] || [ "$port" -gt 65535 ]; then
    echo "⚠️  Invalid port: $port (must be 1024-65535)"
    exit 1
fi

# Check if anything is running on the port
if lsof -i :$port 2>/dev/null | grep LISTEN > /dev/null; then
    # Get process info before killing
    process_info=$(lsof -i :$port | grep LISTEN | head -1)
    process_name=$(echo "$process_info" | awk '{print $1}')
    pid=$(echo "$process_info" | awk '{print $2}')

    echo "🔪 Killing process on port $port:"
    echo "   Process: $process_name (PID: $pid)"

    # Kill with error handling
    if kill -9 "$pid" 2>/dev/null; then
        echo "   ✅ Successfully killed process $pid"
    else
        echo "   ❌ Failed to kill process $pid (may require sudo)"
        exit 1
    fi
else
    echo "ℹ️  No process running on port $port"
fi
'''

