echo ""
combined_cert_file="tmp/combined_ca_certs.pem"
echo "Combined cert file: $combined_cert_file"
if [ -f "$combined_cert_file" ]; then
  cert_count=$(grep -c "BEGIN CERTIFICATE" "$combined_cert_file" || echo "0")
  file_size=$(ls -lh "$combined_cert_file" | awk '{print $5}')
  echo "  ✓ Exists ($cert_count certificates, $file_size)"
  echo "  Last modified: $(stat -f "%Sm" "$combined_cert_file" 2>/dev/null || stat -c "%y" "$combined_cert_file" 2>/dev/null)"
else
  echo "  ✗ Missing - run: mise run setup-ssl-certs"
fi

echo ""
echo "Testing SSL connection to api.resend.com..."
if curl -s --max-time 5 --cacert "${SSL_CERT_FILE:-$default_cert_file}" https://api.resend.com > /dev/null 2>&1; then
  echo "  ✓ Connection successful"
else
  echo "  ✗ Connection failed"
  echo ""
  echo "Testing with verbose output:"
  curl -v --max-time 5 --cacert "${SSL_CERT_FILE:-$default_cert_file}" https://api.resend.com 2>&1 | grep -i "certificate\|ssl\|error" | head -10
fi

echo ""
echo "Testing SSL connection to api.sendgrid.com..."
if curl -s --max-time 5 --cacert "${SSL_CERT_FILE:-$default_cert_file}" https://api.sendgrid.com > /dev/null 2>&1; then
  echo "  ✓ Connection successful"
else
  echo "  ✗ Connection failed"
fi
'''

[tasks.activate-resend]
description = "Activate Resend for post emails (force all emails through Resend)"
run = '''
#!/usr/bin/env bash
echo "🔧 Activating Resend for post emails..."
echo ""

# Get seller email from user or use default
SELLER_EMAIL="${1:-seller@gumroad.com}"

echo "Activating Resend for: $SELLER_EMAIL"
echo ""

cd /Users/yoda/github/antiwork/gumroad
export SSL_CERT_FILE="/Users/yoda/github/antiwork/gumroad/tmp/combined_ca_certs.pem"

rails runner <<RUBY
user = User.find_by(email: "$SELLER_EMAIL")
if user.nil?
  puts "❌ User not found: $SELLER_EMAIL"
  puts "   Available users:"
  User.limit(5).each { |u| puts "     - #{u.email}" }
  exit 1
end

puts "Found user: #{user.email} (ID: #{user.id})"
puts ""

# Activate force_resend_for_post_emails to force all emails through Resend
Feature.activate_user(:force_resend_for_post_emails, user)
puts "✓ Activated: force_resend_for_post_emails"
puts "  All post emails will now go through Resend"
puts ""

# Also activate use_resend_for_post_emails for routing
Feature.activate_user(:use_resend_for_post_emails, user)
puts "✓ Activated: use_resend_for_post_emails"
puts ""

# Verify
if Feature.active?(:force_resend_for_post_emails, user)
  puts "✅ Resend is now active for #{user.email}"
  puts "   All post emails will be sent via Resend"
else
  puts "❌ Failed to activate Resend"
end
RUBY
'''

# 🌐 Ngrok Tunnel
[tasks.ngrok]
description = "Start ngrok tunnel to Rails development server (port 3000) with custom URL"
run = '''
#!/usr/bin/env bash
# Get ngrok domain from LOCAL_PROXY_DOMAIN (strip https:// if present)
NGROK_DOMAIN="${LOCAL_PROXY_DOMAIN:-better-sturgeon-evidently.ngrok-free.app}"
NGROK_DOMAIN="${NGROK_DOMAIN#https://}"
NGROK_DOMAIN="${NGROK_DOMAIN#http://}"

echo "🌐 Starting ngrok tunnel to Rails server (port 3000)..."
echo "   Local: http://localhost:3000"
echo "   Public URL: https://${NGROK_DOMAIN}"
echo "   Press Ctrl+C to stop"
echo ""
echo "💡 Use this URL in Resend webhook configuration:"
echo "   https://${NGROK_DOMAIN}/resend-webhook"
echo ""
echo "💡 LOCAL_PROXY_DOMAIN is set to: ${LOCAL_PROXY_DOMAIN:-not set}"
echo ""
npx --yes ngrok http --url="${NGROK_DOMAIN}" 3000
'''

