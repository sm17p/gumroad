# 🔒 SSL Certificate Management
[tasks.setup-ssl-certs]
description = "Setup SSL certificates (combines OpenSSL and mkcert certs) - one-time setup"
run = '''
#!/usr/bin/env bash
echo "🔒 Setting up SSL certificates..."
echo ""

default_cert_file=$(ruby -ropenssl -e 'puts OpenSSL::X509::DEFAULT_CERT_FILE')
mkcert_root_ca_file="$(mkcert -CAROOT)/rootCA.pem"
combined_cert_file="tmp/combined_ca_certs.pem"

echo "Default OpenSSL cert: $default_cert_file"
if [ -f "$default_cert_file" ]; then
  echo "  ✓ Exists ($(wc -l < "$default_cert_file" | tr -d ' ') lines)"
else
  echo "  ✗ Missing!"
fi

echo ""
echo "mkcert root CA: $mkcert_root_ca_file"
if [ -f "$mkcert_root_ca_file" ]; then
  echo "  ✓ Exists ($(wc -l < "$mkcert_root_ca_file" | tr -d ' ') lines)"
else
  echo "  ✗ Missing! Run: mkcert -install"
fi

echo ""
if [ -f "$default_cert_file" ] && [ -f "$mkcert_root_ca_file" ]; then
  mkdir -p tmp
  cat "$default_cert_file" "$mkcert_root_ca_file" > "$combined_cert_file"
  echo "✓ Combined certificates created at $combined_cert_file"
  echo "  ($(wc -l < "$combined_cert_file" | tr -d ' ') total lines)"
  echo ""
  echo "SSL_CERT_FILE is set in mise.toml to: ${PWD}/tmp/combined_ca_certs.pem"
else
  echo "⚠️  Warning: Could not create combined cert file"
  echo "  Using default cert file: $default_cert_file"
fi
'''

